name: Generate LinkedIn Post

on:
  # Scheduled: Mon/Wed/Fri at 2:30 UTC (8:00 AM IST)
  schedule:
    - cron: '30 2 * * 1,3,5'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'generate'
        type: choice
        options:
          - generate
          - publish
          - update-metrics
          - optimize
      topic:
        description: 'Topic override (optional)'
        required: false
        type: string
      post_type:
        description: 'Post type override (optional)'
        required: false
        type: string

jobs:
  generate:
    if: github.event_name == 'schedule' || github.event.inputs.action == 'generate'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          ARGS="--dry-run"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="$ARGS --topic ${{ github.event.inputs.topic }}"
          fi
          if [ -n "${{ github.event.inputs.post_type }}" ]; then
            ARGS="$ARGS --post-type ${{ github.event.inputs.post_type }}"
          fi
          python -m src.main generate $ARGS

      - name: Commit drafts
        run: |
          git config user.name "LinkedIn Automation Bot"
          git config user.email "bot@linkedin-automation.local"
          git add posts/drafts/ posts/briefings/ data/
          git diff --cached --quiet || git commit -m "Auto-generate LinkedIn post draft [$(date +%Y-%m-%d)]"
          git push

  publish:
    if: github.event.inputs.action == 'publish'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish approved posts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main publish

      - name: Commit published status
        run: |
          git config user.name "LinkedIn Automation Bot"
          git config user.email "bot@linkedin-automation.local"
          git add posts/published/ data/
          git diff --cached --quiet || git commit -m "Published LinkedIn post [$(date +%Y-%m-%d)]"
          git push

  update-metrics:
    if: github.event.inputs.action == 'update-metrics'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update metrics
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python -m src.main analytics

      - name: Commit metrics
        run: |
          git config user.name "LinkedIn Automation Bot"
          git config user.email "bot@linkedin-automation.local"
          git add data/
          git diff --cached --quiet || git commit -m "Update post metrics [$(date +%Y-%m-%d)]"
          git push

  optimize:
    if: github.event.inputs.action == 'optimize'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimization
        run: python -m src.main learn --optimize

      - name: Commit insights
        run: |
          git config user.name "LinkedIn Automation Bot"
          git config user.email "bot@linkedin-automation.local"
          git add data/
          git diff --cached --quiet || git commit -m "Update learning insights [$(date +%Y-%m-%d)]"
          git push
