# Content Calendar — 6-week rotation cycle
# Each week focuses on different subtopics across Mon/Wed/Fri
# Post types rotate: insight, analysis, story, data-driven, opinion, current-event

weeks:
  week_1:
    monday:
      topic: crude_oil_and_energy
      post_type: current_event
      visual: carousel
      theme: "What's moving in energy markets this week"
    wednesday:
      topic: metals_and_mining
      post_type: analysis
      visual: image
      theme: "Deep dive into a metal's supply-demand dynamics"
    friday:
      topic: geopolitics_and_trade
      post_type: opinion
      visual: none
      theme: "Geopolitical event and its commodity impact"

  week_2:
    monday:
      topic: agriculture_and_food
      post_type: data_driven
      visual: carousel
      theme: "Agricultural commodity trends with data"
    wednesday:
      topic: shipping_and_logistics
